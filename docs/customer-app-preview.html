<style>
/* Layout: one phone-width app column (the real thing), with a handoff notes rail beside it on desktop and below it on phones. Single dark look, matching the Superfit admin. */
:root {
  color-scheme: dark;
  --bg: #000000;
  --surface: #0e0e10;
  --surface-2: #17171a;
  --line: #27272b;
  --fg: #ffffff;
  --muted: #9b9ba3;
  --dim: #6c6c74;
  --red: #e5194d;
  --red-ink: #ff4d75;
  --ok: #34d063;
  --ok-bg: #0f2a18;
  --warn: #f5a524;
  --warn-bg: #2e2209;
  --deny-bg: #2e0d16;
  --protein: #3f9cff;
  --carbs: #f7c948;
  --fat: #ff5a7a;
  --font-display: "Barlow Condensed", "Noto Sans Thai", "Arial Narrow", sans-serif;
  --font-body: "Inter", "Noto Sans Thai", system-ui, -apple-system, sans-serif;
  --r-card: 24px;
  --r-pill: 999px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: 16px; line-height: 1.5; padding-inline: 16px; padding-block: 16px 32px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--red-ink); outline-offset: 2px; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.stage { display: grid; gap: 24px; justify-content: center; grid-template-columns: minmax(0, 430px); }
@media (min-width: 1024px) { .stage { grid-template-columns: 430px minmax(0, 380px); align-items: start; } .notes { position: sticky; top: 16px; } }

.picker { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.picker button { flex: none; padding: 10px 16px; min-height: 44px; border-radius: var(--r-pill); background: var(--surface-2); color: var(--muted); font-weight: 600; font-size: 14px; }
.picker button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

.phone { position: relative; background: var(--bg); border: 1px solid var(--line); border-radius: 36px; overflow: hidden; min-height: 760px; display: flex; flex-direction: column; }
@media (max-width: 479px) { .phone { border: 0; border-radius: 0; margin-inline: -16px; } }

/* header, like the admin */
.top { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; z-index: 5; }
.logo { display: flex; align-items: center; gap: 4px; font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: -0.02em; line-height: 1; margin-right: auto; }
.logo svg { width: 26px; height: 26px; fill: var(--fg); }
.lang { display: flex; padding: 3px; border: 1px solid var(--line); border-radius: 14px; }
.lang button { min-width: 44px; min-height: 36px; padding: 0 10px; border-radius: 11px; font-weight: 600; font-size: 14px; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: linear-gradient(140deg, #3a3a40, #1b1b1f); border: 1px solid var(--line); }

main { flex: 1; padding: 24px 16px 120px; display: grid; gap: 16px; align-content: start; }
.eyebrow { color: var(--red-ink); font-size: 13px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; }
.label { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; line-height: 0.95; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 { font-size: 52px; }
h2 { font-size: 36px; }
h3 { font-size: 26px; }
p { margin: 0; }
.muted { color: var(--muted); }
.head { display: grid; gap: 6px; }
.row { display: flex; align-items: center; gap: 12px; }
.between { justify-content: space-between; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 20px; display: grid; gap: 16px; min-width: 0; }
.inset { background: var(--surface-2); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 6px; }
.pill { display: inline-flex; align-items: center; padding: 6px 14px; border-radius: var(--r-pill); font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
.pill.ok { color: var(--ok); background: var(--ok-bg); }
.pill.warn { color: var(--warn); background: var(--warn-bg); }
.pill.deny { color: var(--red-ink); background: var(--deny-bg); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 24px; border-radius: var(--r-pill); font-weight: 600; font-size: 17px; }
.btn.primary { background: var(--red); color: #fff; }
.btn.light { background: var(--fg); color: var(--bg); }
.btn.ghost { background: var(--surface-2); border: 1px solid var(--line); }
.btn.block { width: 100%; }
.btn:active, .tap:active { transform: scale(0.98); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; gap: 2px; min-width: 0; }
.stat b { font-family: var(--font-display); font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
.dl { display: grid; gap: 4px; }
.dl dd { margin: 0; font-size: 20px; font-variant-numeric: tabular-nums; }
.list { display: grid; border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; }
.list > * { padding: 16px 20px; display: flex; align-items: center; gap: 12px; justify-content: space-between; background: var(--surface); }
.list > * + * { border-top: 1px solid var(--line); }
.list small { color: var(--muted); font-size: 14px; }

/* bottom nav: Check-in / Members style, five tabs with a raised pass button */
.nav { position: sticky; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; background: rgba(0,0,0,0.92); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 8px 4px calc(10px + env(safe-area-inset-bottom, 0px)); margin-top: auto; }
.nav button { display: grid; justify-items: center; gap: 4px; min-height: 52px; font-size: 12px; font-weight: 600; color: var(--muted); }
.nav button[aria-current="page"] { color: var(--red-ink); }
.nav .passbtn span.disc { width: 58px; height: 58px; margin-top: -26px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 24px rgba(229, 25, 77, 0.45); border: 4px solid var(--bg); }
.nav .passbtn[aria-current="page"] { color: var(--fg); }

/* sign-in */
.signin { padding: 32px 20px 40px; display: grid; gap: 28px; align-content: start; flex: 1; background: radial-gradient(120% 60% at 100% 0%, rgba(229,25,77,0.22), transparent 60%), var(--bg); }
.signin h1 { font-size: 64px; }
.auth { display: grid; gap: 12px; }
.auth .btn { width: 100%; justify-content: flex-start; padding-left: 22px; }
.auth .btn svg { width: 22px; height: 22px; }
.auth .btn .grow { flex: 1; text-align: center; margin-right: 32px; }
.field { display: grid; gap: 8px; }
.field input { min-height: 56px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); font: inherit; font-size: 17px; padding: 0 18px; width: 100%; }

/* pass */
.pass { position: relative; border-radius: 28px; padding: 22px; display: grid; gap: 18px; justify-items: center; text-align: center; background: linear-gradient(160deg, #1b1b1f, #0b0b0d 55%); border: 1px solid var(--line); overflow: hidden; isolation: isolate; }
.pass::before { content: ""; position: absolute; inset: -40%; z-index: -1; background: conic-gradient(from 0deg, transparent 0 70%, rgba(229,25,77,0.35) 80%, transparent 90%); animation: spin 6s linear infinite; }
.pass::after { content: ""; position: absolute; inset: 1px; z-index: -1; border-radius: 27px; background: linear-gradient(160deg, #18181c, #0b0b0d 60%); }
@keyframes spin { to { transform: rotate(1turn); } }
.photo { width: 104px; height: 104px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-size: 44px; font-weight: 800; background: linear-gradient(140deg, #e5194d, #7a0f2b); border: 4px solid var(--bg); box-shadow: 0 0 0 2px var(--ok); }
.photo.expired { box-shadow: 0 0 0 2px var(--red-ink); }
.codebox { background: #fff; color: #000; border-radius: 22px; padding: 18px; width: 100%; display: grid; gap: 10px; justify-items: center; }
.codebox .qr { width: 220px; height: 220px; }
.codebox .qr svg { width: 100%; height: 100%; display: block; }
.codebox svg.barcode { width: 100%; max-width: 280px; height: 64px; }
.codebox .digits { font-family: var(--font-display); font-weight: 800; font-size: 40px; letter-spacing: 0.12em; font-variant-numeric: tabular-nums; line-height: 1; }
.live { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); }
.live i { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }

/* ring */
.ring { --p: 0.2; width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; flex: none; background: conic-gradient(var(--ok) calc((1 - var(--p)) * 1turn), var(--surface-2) 0); }
.ring.warn { background: conic-gradient(var(--warn) calc((1 - var(--p)) * 1turn), var(--surface-2) 0); }
.ring > div { width: 74px; height: 74px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; text-align: center; line-height: 1; }
.ring b { font-family: var(--font-display); font-size: 30px; }
.ring small { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0.1em; }
.bar { height: 8px; border-radius: 8px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); border-radius: 8px; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dots i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--protein); }
.dots i.used { background: var(--protein); opacity: 0.35; border-color: transparent; }

/* product cards, like the Till */
.cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.cats button { display: grid; justify-items: center; gap: 6px; padding: 14px 4px; min-height: 80px; border-radius: 20px; border: 1px solid var(--line); font-family: var(--font-display); font-weight: 800; font-size: 16px; text-transform: uppercase; color: var(--muted); }
.cats button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); border-color: #3a3a40; }
.product { position: relative; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 8px; padding: 20px; border-radius: var(--r-card); border: 1px solid var(--line); background: var(--surface); overflow: hidden; min-height: 300px; }
.product .copy { display: grid; gap: 12px; align-content: start; position: relative; z-index: 1; }
.product h3 { font-size: 34px; }
.macros { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.macro { border: 1px solid var(--line); border-radius: 16px; padding: 8px 10px; background: rgba(14,14,16,0.85); display: grid; line-height: 1.15; }
.macro b { display: flex; align-items: center; gap: 4px; font-size: 18px; font-variant-numeric: tabular-nums; }
.macro b svg { width: 15px; height: 15px; }
.macro span { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0.12em; }
.can { align-self: stretch; border-radius: 18px; position: relative; display: grid; place-items: center; overflow: hidden; }
.can .label-v { writing-mode: vertical-rl; transform: rotate(180deg); font-family: var(--font-display); font-weight: 800; font-size: 46px; color: rgba(255,255,255,0.9); letter-spacing: -0.02em; }
.add { position: absolute; right: 16px; bottom: 16px; width: 52px; height: 52px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; z-index: 2; }
.price { font-family: var(--font-display); font-size: 24px; font-weight: 800; }
.mini { display: grid; grid-auto-flow: column; grid-auto-columns: 72%; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; scrollbar-width: none; }
.mini > * { scroll-snap-align: start; }
.mini .product { min-height: 0; grid-template-columns: 1fr; padding: 16px; }
.mini .product h3 { font-size: 26px; }

/* coaches */
.coach { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 16px; align-items: center; }
.portrait { width: 96px; height: 120px; border-radius: 18px; display: grid; place-items: end start; padding: 10px; font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 0.8; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 6px 12px; border-radius: var(--r-pill); background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.choice { display: flex; flex-wrap: wrap; gap: 8px; }
.choice button { min-height: 44px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
.choice button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* sheet + toast */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: 20; display: flex; align-items: flex-end; }
.sheet { width: 100%; background: var(--surface); border-top: 1px solid var(--line); border-radius: 28px 28px 0 0; padding: 12px 20px calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; max-height: 88%; overflow-y: auto; animation: up 0.28s cubic-bezier(.2,.8,.2,1); }
.sheet .grab { width: 44px; height: 5px; border-radius: 5px; background: var(--line); justify-self: center; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.toast { position: absolute; left: 16px; right: 16px; top: 76px; z-index: 30; padding: 14px 18px; border-radius: 18px; background: var(--ok-bg); color: var(--ok); border: 1px solid rgba(52,208,99,0.3); font-weight: 600; display: flex; gap: 10px; align-items: center; }

/* notes rail */
.notes { display: grid; gap: 14px; align-content: start; }
.notes .card { gap: 12px; }
.notes h2 { font-size: 30px; }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; color: var(--muted); font-size: 15px; }
.notes code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: var(--fg); background: var(--surface-2); padding: 1px 6px; border-radius: 6px; overflow-wrap: anywhere; }
.notes .eyebrow { font-size: 12px; }
.example { font-size: 13px; color: var(--dim); }

@media (prefers-reduced-motion: reduce) {
  .pass::before, .live i, .sheet { animation: none; }
}
</style>

  function qrSvg(text) {
    if (typeof qrcode !== "function") return '<div style="display:grid;place-items:center;height:100%;font-weight:700">' + text + "</div>";
    const q = qrcode(0, "M");
    q.addData(text);
    q.make();
    const n = q.getModuleCount();
    let d = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += "M" + c + " " + r + "h1v1h-1z";
    return '<svg viewBox="-2 -2 ' + (n + 4) + " " + (n + 4) + '" shape-rendering="crispEdges" role="img" aria-label="QR code ' + text + '"><rect x="-2" y="-2" width="' + (n + 4) + '" height="' + (n + 4) + '" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
  }

  let tick;
  function render() {
    $("#nav").hidden = current === "signin" || current === "link";
    $("#avatarBtn").hidden = current === "signin" || current === "link";
    screenEl.innerHTML = views[current]() + sheet();
    document.querySelectorAll("#nav [data-go]").forEach((b) => (b.dataset.go === current ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current")));
    document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = t(el.dataset.t)));
    $("#picker").innerHTML = SCREENS.map((s) => '<button type="button" data-screen="' + s[0] + '" aria-pressed="' + (s[0] === current) + '">' + s[1] + "</button>").join("");
    const n = NOTES[current];
    $("#notes").innerHTML = '<div class="card"><span class="eyebrow">Build notes</span><h2>' + n.title + "</h2><ul>" + n.items.map((x) => "<li>" + x + "</li>").join("") + "</ul></div>" +
      '<div class="card" style="gap:8px"><span class="label">Files</span><ul><li><code>lib/customer/pass.ts</code> · pass code + membership view</li><li><code>lib/customer/link.ts</code> · linking rules + desk QR</li><li><code>supabase/customer-app.sql</code> · tables + RPCs</li><li><code>supabase/functions/*</code> · link-account, member-invite, desk-link</li></ul></div>';

    clearInterval(tick);
    if (current === "pass") {
      try { JsBarcode("#barcode", ME.code, { format: "CODE128", displayValue: false, margin: 0, height: 64, width: 2.4, background: "#ffffff", lineColor: "#000000" }); } catch (e) { /* library offline: QR still works */ }
      const clock = () => { const el = $("#clock"); if (el) el.textContent = "LIVE · " + new Date().toLocaleTimeString("en-GB"); };
      clock();
      tick = setInterval(clock, 1000);
    }
    if (current === "link") {
      let left = 15 * 60;
      tick = setInterval(() => { left = Math.max(0, left - 1); const el = $("#countdown"); if (el) el.textContent = "Fresh for " + Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0"); }, 1000);
    }
  }

  function go(s) { current = s; state.sheet = null; render(); $("#phone").scrollIntoView({ block: "nearest" }); }

  document.addEventListener("click", (e) => {
    const el = e.target.closest("button, .scrim");
    if (!el) return;
    if (el.dataset.screen) return go(el.dataset.screen);
    if (el.dataset.go) return go(el.dataset.go);
    if (el.dataset.lang) {
      lang = el.dataset.lang;
      document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
      return render();
    }
    if (el.dataset.cat) { state.cat = el.dataset.cat; return render(); }
    if (el.dataset.coach) { state.sheet = el.dataset.coach; return render(); }
    if (el.dataset.pick) { state.pick[el.dataset.pick] = el.dataset.val; return render(); }
    const act = el.dataset.act;
    if (act === "close" && (el.classList.contains("scrim") ? e.target === el : true)) { state.sheet = null; return render(); }
    if (act === "send") {
      const c = COACHES.find((x) => x.slug === state.sheet);
      const d = new Date(TODAY); d.setDate(d.getDate() + Number(state.pick.day));
      state.sent = { ref: "PT-4F2A1C", coach: c.name, when: d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "short" }) + " at " + state.pick.time };
      state.sheet = null; render(); return toast("Sent to " + c.name);
    }
    if (act === "signed-in") return go("link");
    if (act === "linked") { go("home"); return toast("You're linked. Welcome, " + ME.first + "."); }
  });
  document.addEventListener("submit", (e) => { if (e.target.id === "emailForm") { e.preventDefault(); state.emailSent = true; render(); } });

  render();
})();
</script>
